# abloh.yml - CI reads this from the PR merge base, so changes are reviewed like code.
# Keys: https://abloh.dev/docs#config

# % of mechanical breaks in changed lines your tests must catch.
threshold: 70

# true: below threshold fails abloh's check in CI. Blocks merges only if also
# marked required in branch protection.
enforce: true

# The job in your own CI that abloh's step rides. abloh reads your workflows to
# pick it and proves the choice by running there. Change it to move the step.
# That job runs once per matrix leg, and matrixLeg is the one it rides. abloh's
# step carries an if: that is true on this leg only, so it measures once.
setup:
  job: .github/workflows/ci.yml::test
  matrixLeg:
    node_version_to_setup: 22

# How CI rebuilds this project for abloh's check. Comments name the source file.
environment:
  runtimeImage: node:22.23.1-bookworm-slim@sha256:6c74791e557ce11fc957704f6d4fe134a7bc8d6f5ca4403205b2966bd488f6b3 # Node 22.23.1 (the Node your setup.matrixLeg pins, of your CI matrix [22, 24, 25, 26], node ^22.0.0 || ^24.0.0 || ^25.0.0 || >=26.0.0 in package.json), pinned to the digest abloh holds for it
  installDirectory: .
  setup: .abloh/setup.sh # written by init and yours to edit. Every cold run executes it step by step
  testCommand: node --experimental-strip-types --throw-deprecation --test --experimental-test-isolation=none --test-concurrency=1 --test-reporter=spec "src/**/__tests__/**/*-test.ts" # set by you
  sealedTestCommand: node --experimental-strip-types --throw-deprecation --test --experimental-test-isolation=none --test-concurrency=1 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination=stdout 'src/**/__tests__/**/*-test.ts' # your node-test command with abloh's report added for proving proposed tests
  identityFiles: # a change here makes CI reinstall instead of reusing its image
    - .npmrc

name: CI
on: workflow_call
permissions: {}
jobs:
  lint:
    name: Lint source files
    runs-on: ubuntu-latest
    permissions:
      contents: read # for actions/checkout
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version-file: '.node-version'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Lint ESLint
        run: npm run lint

      - name: Check Types
        run: npm run check:ts

      - name: Lint Prettier
        run: npm run prettier:check

      - name: Spellcheck
        run: npm run check:spelling

      - name: Lint GitHub Actions
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  checkForCommonlyIgnoredFiles:
    name: Check for commonly ignored files
    runs-on: ubuntu-latest
    permissions:
      contents: read # for actions/checkout
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check if commit contains files that should be ignored
        run: |
          git clone --depth 1 https://github.com/github/gitignore.git

          rm -f gitignore/Global/ModelSim.gitignore
          rm -f gitignore/Global/Images.gitignore
          cat gitignore/Node.gitignore gitignore/Global/*.gitignore > all.gitignore

          IGNORED_FILES=$(git ls-files --cached --ignored --exclude-from=all.gitignore)
          if  [[ "$IGNORED_FILES" != "" ]]; then
            echo -e "::error::Please remove these files:\n$IGNORED_FILES" | sed -z 's/\n/%0A/g'
            exit 1
          fi

  checkPackageLock:
    name: Check health of package-lock.json file
    runs-on: ubuntu-latest
    permissions:
      contents: read # for actions/checkout
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version-file: '.node-version'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Check that package-lock.json doesn't have conflicts
        run: npm ls --depth 999

      - name: Run npm install
        run: npm install --ignore-scripts --force --package-lock-only --engine-strict --strict-peer-deps

      - name: Check that package-lock.json is in sync with package.json
        run: git diff --exit-code package-lock.json

  integrationTests:
    name: Run integration tests
    runs-on: ubuntu-latest
    permissions:
      contents: read # for actions/checkout
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          # We install bunch of packages during integration tests without locking them
          # so we skip cache action to not pollute cache for other jobs.

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Run Integration Tests
        run: npm run check:integrations

  fuzz:
    name: Run fuzzing tests
    runs-on: ubuntu-latest
    permissions:
      contents: read # for actions/checkout
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version-file: '.node-version'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Run Tests
        run: npm run fuzzonly

  test:
    name: Run tests on Node v${{ matrix.node_version_to_setup }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node_version_to_setup: [22, 24, 25, 26]
    permissions:
      contents: read # for actions/checkout
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js v${{ matrix.node_version_to_setup }}
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: ${{ matrix.node_version_to_setup }}

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Run Tests with coverage
        run: npm run testonly:cover
      # Abloh. It sits right after "Run Tests with coverage", the step that runs your
      # suite on this leg, so it measures the tree your suite ran in and rebuilds nothing
      # of yours. It puts that tree back exactly as it found it, so the steps below still
      # see what they always saw.
      # It installs its own CLI - and its own Node, if this runner's is older than 20.6 -
      # under RUNNER_TEMP, leaving your PATH alone.
      # model-token is Abloh's own credential for this repository, kept in your Actions
      # secrets. GitHub hands a secret to the step that names it and to no other step,
      # which is why Abloh asks for one instead of a job-wide id-token permission.
      # The if: runs it even when an earlier step of yours failed, so it says so rather
      # than vanishing. It reports on this pull request and gates nothing until merge,
      # and it files none of that itself - the abloh-publish job in
      # .github/workflows/pull_request.yml does, because this workflow is called rather than started and
      # GitHub caps a called workflow's jobs at what its caller grants. Another caller
      # runs this step too and has no such job, so its report simply goes unpublished.
      # Pinned to a commit; a tag can be moved.
      # The rest of the if: pins it to the one leg named in abloh.yml's setup.matrixLeg,
      # so this job still fans out and Abloh measures once instead of once per leg.
      # ADDED BY THE ABLOH FIRST-CONTACT CENSUS: this run reports to https://api.staging.abloh.dev rather than
      # the published control plane, so the model half is measured against the gateway that
      # deployment runs. Recorded in every row this workflow produced.
      - name: Abloh census - point this job at https://api.staging.abloh.dev
        run: |
          set -euo pipefail
          {
            echo "ABLOH_DEV_HANDOFF_URL=https://api.staging.abloh.dev/api/v1/runs"
            echo "ABLOH_DEV_MODEL_GATEWAY_URL=https://api.staging.abloh.dev/api/v1/model/chat/completions"
            echo "ABLOH_DEV_LIVE_PROGRESS_URL=https://api.staging.abloh.dev/api/v1/runs/live-progress"
            echo "ABLOH_DEV_CHECK_ADMISSION_URL=https://api.staging.abloh.dev/api/v1/runs/admission"
            echo "ABLOH_DEV_SETUP_TRIAL_URL=https://api.staging.abloh.dev/api/v1/setup/trial"
          } >> "$GITHUB_ENV"
      - name: Abloh
        if: ${{ !cancelled() && matrix.node_version_to_setup == '22' }}
        uses: kkennethlau12393/abloh-action-census@75aab7f446c29a752a0f7dc9cea133e6524cd376
        with:
          # ADDED BY THE ABLOH FIRST-CONTACT CENSUS: this run measures a build of the product
          # rather than the published CLI. Recorded in every row this workflow produced.
          cli-tarball: .abloh-census/engine/abloh-cli-0.1.4.tgz .abloh-census/engine/abloh-aster-0.1.0.tgz .abloh-census/engine/abloh-core-0.1.3.tgz .abloh-census/engine/abloh-marigold-0.1.0.tgz .abloh-census/engine/abloh-measure-0.1.0.tgz .abloh-census/engine/abloh-repository-0.1.0.tgz .abloh-census/engine/abloh-triage-0.1.2.tgz
          base: ${{ github.event.pull_request.base.sha }}
          job-status: ${{ job.status }}
          publish: attestation-job
          model-token: ${{ secrets.ABLOH_MODEL_TOKEN }}
      # ---------------------------------------------------------------------------------
      # ADDED BY THE ABLOH FIRST-CONTACT CENSUS, and these are the only lines of this file
      # that are not what `abloh init` wrote. It keeps the run's own artifact so the
      # census can classify from evidence rather than from this job's log. It runs after
      # everything Abloh does and cannot reach what was measured.
      # ---------------------------------------------------------------------------------
      - name: census - keep the run artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: abloh-census-evidence-${{ github.job }}-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/abloh-evidence-manifest.json
            ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/abloh-run.json
            ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/attest-results.json
            ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/attest-summary.md
            ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/abloh-proposals-proofs.json
            ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/abloh-sweep.json
            ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/abloh-sweep-summary.json
            ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/abloh-sweep-preceding-refusal.json
            ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/abloh-refusal.json
          if-no-files-found: ignore
          retention-days: 30

  codeql:
    name: Run CodeQL security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read # for actions/checkout
      security-events: write # for codeql-action
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: 'javascript, typescript'

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4

  build-npm-dist:
    name: Build 'npmDist' artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read # for actions/checkout
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version-file: '.node-version'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Build NPM package
        run: npm run build:npm

      - name: Upload npmDist package
        uses: actions/upload-artifact@v7
        with:
          name: npmDist
          path: ./npmDist

  build-deno-dist:
    name: Build 'denoDist' artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read # for actions/checkout
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version-file: '.node-version'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Build Deno package
        run: npm run build:deno

      - name: Upload denoDist package
        uses: actions/upload-artifact@v7
        with:
          name: denoDist
          path: ./denoDist

  check-deno-dist:
    name: Type check denoDist on Deno v${{ matrix.deno_version_to_setup }}
    needs: build-deno-dist
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep minors pinned to preserve backward-compat coverage; include v2.x
        # so CI also exercises the latest Deno release used for publishing.
        deno_version_to_setup: [2.4.x, 2.5.x, 2.6.x, 2.7.x, 2.8.x, v2.x]
    permissions:
      contents: read # for actions/download-artifact
    steps:
      - name: Download denoDist package
        uses: actions/download-artifact@v8
        with:
          name: denoDist
          path: ./denoDist

      - name: Setup Deno v${{ matrix.deno_version_to_setup }}
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ matrix.deno_version_to_setup }}

      - name: Run denoDist package publish dry-run checks
        # `deno publish --dry-run` performs a number of checks including:
        # (a) type-checking package modules/public API,
        # (b) validating exports and module-graph resolution,
        # (c) validating the publish file set (gitignore + publish.exclude/include),
        # (d) validating package metadata/config, and
        # (e) enforcing JSR slow-types checks.
        working-directory: ./denoDist
        run: deno publish --dry-run
